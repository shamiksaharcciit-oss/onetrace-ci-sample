# Generated by `onetrace-ci instrument` from the plan. It runs the pipeline, then the
# onetrace-ci gate against the committed baseline. The gate proves the run's records are
# consistent and match the baseline; it does not prove the pipeline's output is correct.
name: onetrace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  onetrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pipeline
        run: |
          pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Run the pipeline
        env:
          ONETRACE_RUN_ID: onetrace-ci-candidate
        run: |
          python -c "from answering.main import run; print(run())"
      - name: onetrace-ci gate
        uses: shamiksaharcciit-oss/onetrace-ci@4c1f9537a7009e15f7300dbf2b0b8a2a65c0e2b5
        with:
          run: "runs/instrumented/onetrace-ci-candidate"
          baseline: "runs/instrumented-baseline"
          plan: "onetrace-instrument-plan.yaml"
