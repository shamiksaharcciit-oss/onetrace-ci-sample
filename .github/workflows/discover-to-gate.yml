# The whole path, on the un-instrumented answering pipeline: onetrace-ci discover drafts a plan
# from what the fixture test did; ci/decide.py stands in for the person who answers its DECIDE:
# questions; onetrace-ci instrument turns the plan into a patch; the patched pipeline runs once
# and that run is proposed as the baseline; it runs again, and the gate compares the second run
# with the baseline. The gate proves the records are consistent and match the baseline; it does
# not prove the pipeline's output is correct.
name: discover to gate

on:
  push:
    branches: [ci-phase2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-path:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Check out onetrace-ci at one commit
        # Pinned by commit: the code is what that commit holds, and its dependencies install
        # from that commit's own hash-pinned lock.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: shamiksaharcciit-oss/onetrace-ci
          ref: 39d9bad2e88a851f99587d2093a869defe45ad82
          path: .onetrace-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install onetrace-ci and the pipeline
        run: |
          pip install --require-hashes -r .onetrace-ci/requirements.lock
          pip install --no-deps ./.onetrace-ci
          pip install --no-deps -e .
      - name: Discover
        run: |
          onetrace-ci discover --entry answering.main:run --out-dir discovered -- python -m unittest tests.test_answering
          head -40 discovered/discovery-report.md
      - name: Decide (the committed answers stand in for a person)
        run: |
          python ci/decide.py discovered/onetrace-plan.draft.yaml ci/answers.json onetrace-plan.yaml
          cat onetrace-plan.yaml
      - name: Instrument
        run: |
          onetrace-ci instrument --plan onetrace-plan.yaml --repo . --out instrument.patch
          git apply --stat instrument.patch
          git apply instrument.patch
          pip install --no-deps -e .
      - name: First run, proposed as the baseline
        env:
          ONETRACE_RUN_ID: first
        run: |
          python -c "from answering.main import run; print(run())"
          onetrace-ci baseline propose --from runs/first --out runs/ci-baseline
      - name: Second run
        env:
          ONETRACE_RUN_ID: second
        run: python -c "from answering.main import run; print(run())"
      - name: Gate
        run: |
          onetrace-ci gate --run runs/second --baseline runs/ci-baseline --plan onetrace-plan.yaml --out gate-out
          cat gate-out/summary.md
